services:
  outfitory-service:
    build:
      context: ./src
      dockerfile: ./Dockerfile
    container_name: outfitory-service
    ports:
      - "8000:8000"
    volumes:
      - ./src/utils.py:/app/utils.py
      - ./uploads:/app/uploads
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_NAME: ${DB_NAME:-outfitory}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in backend/.env}
      JWT_EXPIRATION_TIME: ${JWT_EXPIRATION_TIME:-7200}
      GROQ_API_KEY: ${GROQ_API_KEY:?Set GROQ_API_KEY in backend/.env}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: outfitory-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-outfitory}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
